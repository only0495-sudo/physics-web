<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>彈力位能與能量損耗模擬器</title>
    <style>
        :root {
            --primary-bg: rgba(20, 22, 30, 0.92);
            --card-bg: rgba(30, 35, 50, 0.8);
            --text-main: #f0f0f0;
            --accent: #4da6ff;
            --danger: #ff4d4d;
            --success: #2ecc71;
            --warning: #f1c40f;
            --panel-border: rgba(255, 255, 255, 0.1);
            --math-font: 'Times New Roman', serif;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #0a0c10;
            font-family: 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
            color: var(--text-main);
            user-select: none;
        }

        canvas { display: block; }

        /* 共通面板樣式 */
        .glass-panel {
            position: absolute;
            background: var(--primary-bg);
            border-radius: 10px;
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(20px);
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        /* 左側資訊面板 */
        #info-panel {
            top: 15px;
            left: 15px;
            width: 320px;
        }

        #info-panel.collapsed {
            transform: translateX(-335px);
        }

        /* 右側控制面板 */
        #control-panel {
            top: 15px;
            right: 15px;
            width: 260px;
            background: var(--card-bg);
        }

        #control-panel.collapsed {
            transform: translateX(275px);
        }

        .panel-toggle-wrapper {
            position: absolute;
            top: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #info-panel .panel-toggle-wrapper { right: -42px; }
        #control-panel .panel-toggle-wrapper { left: -42px; }

        .panel-toggle {
            width: 40px;
            height: 40px;
            background: var(--primary-bg);
            border: 1px solid var(--panel-border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.85rem;
            font-weight: bold;
            backdrop-filter: blur(20px);
        }

        #info-panel .panel-toggle { border-radius: 0 6px 6px 0; }
        #control-panel .panel-toggle { border-radius: 6px 0 0 6px; }

        .toggle-label {
            writing-mode: vertical-lr;
            color: #000;
            padding: 8px 4px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 2px 0 8px rgba(0,0,0,0.3);
        }

        #info-panel .toggle-label { 
            background: var(--accent); 
            border-radius: 0 0 6px 6px;
        }
        #control-panel .toggle-label { 
            background: var(--warning); 
            border-radius: 0 0 0 6px;
        }

        .panel-content { padding: 18px; }
        h1 { margin: 0 0 12px 0; font-size: 1rem; color: var(--accent); }

        .formula-card {
            background: rgba(0, 0, 0, 0.4);
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
            border-left: 4px solid var(--accent);
        }

        .math-block {
            display: block;
            font-family: var(--math-font);
            font-style: italic;
            font-size: 1.05rem;
            margin: 6px 0;
            text-align: left;
            line-height: 1.2;
            white-space: nowrap; 
        }

        /* 控制項樣式 */
        .control-group { margin-bottom: 15px; }
        .control-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 6px;
            color: #ccc;
        }
        .control-label span { color: var(--accent); font-weight: bold; }

        input[type=range] {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            appearance: none;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
        }

        .btn-action {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 6px;
            background: #444;
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-action:hover { filter: brightness(1.2); }
        
        .btn-action.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }
        
        .btn-action.warning-active.active {
            background: var(--warning);
            color: #000;
        }

        #btn-reset {
            background: var(--danger);
            color: #fff;
            margin-top: 5px;
        }

        #btn-fullscreen {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* 圖表 - 放大調整 */
        #chart-container {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 96vw;
            max-width: 1200px;
            height: 280px; /* 從 220 提升到 280 */
            background: var(--primary-bg);
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(10px);
            z-index: 10;
            padding: 15px;
            box-sizing: border-box;
        }

        #slow-mo-indicator {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--warning);
            color: #000;
            padding: 4px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            display: none;
            z-index: 50;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.4);
        }
    </style>
</head>
<body>

    <!-- 左側資訊面板 -->
    <div id="info-panel" class="glass-panel">
        <div class="panel-toggle-wrapper">
            <button class="panel-toggle" id="info-toggle-btn">收起</button>
            <div class="toggle-label">原理說明</div>
        </div>
        <div class="panel-content">
            <h1>彈力位能與能量轉換</h1>
            <p style="font-size: 0.85rem; margin-top: 0;">模擬彈簧在摩擦環境下的運動與能量變化。</p>
            
            <div class="formula-card">
                <div class="math-block">1. 動能: K = ½ m v²</div>
                <div class="math-block">2. 彈力位能: U = ½ k x²</div>
                <div class="math-block" style="color: var(--warning);">3. 總力學能: E = K + U</div>
                <div class="math-block">4. 熱能損耗: Q = 摩擦產生的熱</div>
                <hr style="border:0; border-top:1px solid #555; margin:8px 0;">
                <div class="math-block" style="font-weight: bold; color: var(--success);">
                    系統總能量: Etotal = E + Q
                </div>
            </div>
            <p style="font-size: 0.8rem; color: #bbb; margin-bottom: 0;">
                在平衡點靜止時能量為零。拉動產生位能後，總能量隨之增加。
            </p>
        </div>
    </div>

    <!-- 右側控制面板 -->
    <div id="control-panel" class="glass-panel">
        <div class="panel-toggle-wrapper">
            <button class="panel-toggle" id="ctrl-toggle-btn">收起</button>
            <div class="toggle-label">操作設定</div>
        </div>
        <div class="panel-content">
            <div class="control-group">
                <div class="control-label">物體質量 <span><span id="val-m">2.0</span> kg</span></div>
                <input type="range" id="input-m" min="0.5" max="10" step="0.1" value="2.0">
            </div>
            <div class="control-group">
                <div class="control-label">彈力常數 <span><span id="val-k">15.0</span> N/m</span></div>
                <input type="range" id="input-k" min="1" max="50" step="0.5" value="15.0">
            </div>
            <div class="control-group">
                <div class="control-label">摩擦係數 <span><span id="val-mu">0.00</span></span></div>
                <input type="range" id="input-mu" min="0" max="1" step="0.01" value="0">
            </div>
            
            <button class="btn-action" id="btn-slowmo">開啟慢動作模式</button>
            <button class="btn-action warning-active" id="btn-simple-chart">能量總結圖表模式</button>
            <button class="btn-action" id="btn-reset">重置實驗紀錄</button>
            <hr style="border:0; border-top:1px solid #444; margin:10px 0;">
            <button class="btn-action" id="btn-fullscreen">進入全螢幕</button>
        </div>
    </div>

    <div id="slow-mo-indicator">慢動作模式開啟中</div>

    <div id="chart-container">
        <canvas id="energyChart"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <script type="module">
        const CONFIG = {
            maxPoints: 600,     
            massSize: 65,
            springCoils: 22
        };

        let frameCount = 0;

        const state = {
            m: 2.0,
            k: 15.0,
            mu: 0.0,            
            x: 0,               
            v: 0.0,
            heat: 0.0,          
            isDragging: false,
            isSlowMo: false,
            simpleChart: false,
            timeStep: 1/120, // 增加物理取樣率以提高穩定性
            screenX: 0,         
            restX: 0,           
            wallX: 0,
            initialSystemEnergy: 0 
        };

        const canvas = document.createElement('canvas');
        document.body.appendChild(canvas);
        const ctx = canvas.getContext('2d');

        const chartCtx = document.getElementById('energyChart').getContext('2d');
        const chart = new Chart(chartCtx, {
            type: 'line',
            data: {
                labels: Array(CONFIG.maxPoints).fill(''),
                datasets: [
                    { label: '動能 (K)', borderColor: '#2ecc71', data: Array(CONFIG.maxPoints).fill(0), borderWidth: 2, pointRadius: 0, fill: false },
                    { label: '彈力位能 (U)', borderColor: '#e67e22', data: Array(CONFIG.maxPoints).fill(0), borderWidth: 2, pointRadius: 0, fill: false },
                    { label: '熱能損耗 (Q)', borderColor: '#ff4d4d', backgroundColor: 'rgba(255, 77, 77, 0.1)', data: Array(CONFIG.maxPoints).fill(0), borderWidth: 2, pointRadius: 0, fill: true },
                    { label: '總力學能 (E)', borderColor: '#f1c40f', borderDash: [5, 5], data: Array(CONFIG.maxPoints).fill(0), borderWidth: 2, pointRadius: 0, fill: false },
                    { label: '系統總能量 (Etotal)', borderColor: '#ffffff', borderDash: [2, 2], data: Array(CONFIG.maxPoints).fill(0), borderWidth: 1, pointRadius: 0, fill: false }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                plugins: { 
                    legend: { 
                        labels: { 
                            color: '#eee', 
                            font: { size: 16, weight: 'bold' }, // 再次放大圖例字體
                            boxWidth: 35,
                            padding: 20
                        } 
                    } 
                },
                scales: {
                    x: { display: false },
                    y: { 
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        ticks: { color: '#888', font: { size: 11 } },
                        suggestedMax: 100, min: 0
                    }
                }
            }
        });

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            state.restX = canvas.width / 2;
            state.wallX = state.restX - 350;
            
            if (!state.isDragging && frameCount === 0) {
                state.screenX = state.restX;
                state.x = 0;
                updateInitialEnergy();
            }
        }
        window.addEventListener('resize', resize);

        function updateInitialEnergy() {
            const U = 0.5 * state.k * Math.pow(state.screenX - state.restX, 2);
            const K = 0.5 * state.m * Math.pow(state.v, 2);
            state.initialSystemEnergy = U + K + state.heat;
        }

        function updatePhysics() {
            if (state.isDragging) {
                state.v = 0;
                state.x = state.screenX - state.restX;
                updateInitialEnergy(); 
                return;
            }

            const dt = state.isSlowMo ? state.timeStep * 0.2 : state.timeStep;
            
            // 物理子步進以增加精確度
            for (let i = 0; i < 2; i++) {
                const fSpring = -state.k * state.x;
                const fFriction = -state.mu * 6.0 * state.v; 
                const a = (fSpring + fFriction) / state.m;
                
                state.v += a * (dt/2);
                state.x += state.v * (dt/2);
            }
            
            state.screenX = state.restX + state.x;
            state.heat += Math.abs(-state.mu * 6.0 * state.v * state.v) * dt;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const groundY = canvas.height / 2;
            const mX = state.screenX;
            const mSize = CONFIG.massSize;

            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, groundY + mSize/2);
            ctx.lineTo(canvas.width, groundY + mSize/2);
            ctx.stroke();

            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(state.wallX - 30, groundY - 120, 30, 240);
            
            ctx.setLineDash([5, 5]);
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
            ctx.beginPath();
            ctx.moveTo(state.restX, groundY - 150);
            ctx.lineTo(state.restX, groundY + 150);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.strokeStyle = '#95a5a6';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(state.wallX, groundY);
            const springWidth = mX - state.wallX - mSize/2;
            const step = springWidth / CONFIG.springCoils;
            for(let i=1; i<=CONFIG.springCoils; i++){
                const px = state.wallX + i * step;
                const py = groundY + (i % 2 === 0 ? -25 : 25);
                ctx.lineTo(i === CONFIG.springCoils ? mX - mSize/2 : px, i === CONFIG.springCoils ? groundY : py);
            }
            ctx.stroke();

            ctx.fillStyle = state.isDragging ? '#ff7f7f' : '#ff4d4d';
            ctx.shadowBlur = 15;
            ctx.shadowColor = 'rgba(255, 77, 77, 0.4)';
            ctx.fillRect(mX - mSize/2, groundY - mSize/2, mSize, mSize);
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#fff';
            ctx.strokeRect(mX - mSize/2, groundY - mSize/2, mSize, mSize);

            // 能量計算
            let K = 0.5 * state.m * state.v * state.v;
            let U = 0.5 * state.k * state.x * state.x;
            
            // 理論總力學能與系統總能
            const totalEnergy = state.initialSystemEnergy;
            const mechEnergy = Math.max(0, totalEnergy - state.heat);

            // 修正：強制將顯示的 K 和 U 限制在理論值 mechEnergy 之下
            // 這是為了處理數值積分中極微小的誤差造成的「溢出」現象
            if (K > mechEnergy) K = mechEnergy;
            if (U > mechEnergy) U = mechEnergy;

            if (frameCount % 2 === 0) {
                chart.data.datasets[0].data.push(K);
                chart.data.datasets[1].data.push(U);
                chart.data.datasets[2].data.push(state.heat);
                chart.data.datasets[3].data.push(mechEnergy); 
                chart.data.datasets[4].data.push(totalEnergy);
                
                chart.data.datasets.forEach(d => d.data.shift());
                
                // 動態調整 Y 軸，確保略大於總能，視覺上不會穿頂
                const currentMax = Math.max(100, totalEnergy * 1.1);
                if (currentMax > chart.options.scales.y.suggestedMax) {
                    chart.options.scales.y.suggestedMax = Math.ceil(currentMax / 20) * 20;
                }
                chart.update();
            }
        }

        const inputM = document.getElementById('input-m');
        const inputK = document.getElementById('input-k');
        const inputMu = document.getElementById('input-mu');
        const valM = document.getElementById('val-m');
        const valK = document.getElementById('val-k');
        const valMu = document.getElementById('val-mu');

        inputM.oninput = () => { state.m = parseFloat(inputM.value); valM.innerText = state.m.toFixed(1); updateInitialEnergy(); };
        inputK.oninput = () => { state.k = parseFloat(inputK.value); valK.innerText = state.k.toFixed(1); updateInitialEnergy(); };
        inputMu.oninput = () => { state.mu = parseFloat(inputMu.value); valMu.innerText = state.mu.toFixed(2); };

        const btnSlowmo = document.getElementById('btn-slowmo');
        const btnSimple = document.getElementById('btn-simple-chart');
        const btnReset = document.getElementById('btn-reset');
        const btnFullscreen = document.getElementById('btn-fullscreen');

        btnSlowmo.onclick = () => {
            state.isSlowMo = !state.isSlowMo;
            btnSlowmo.classList.toggle('active', state.isSlowMo);
            btnSlowmo.innerText = state.isSlowMo ? '慢動作：開啟' : '開啟慢動作模式';
            document.getElementById('slow-mo-indicator').style.display = state.isSlowMo ? 'block' : 'none';
        };

        btnSimple.onclick = () => {
            state.simpleChart = !state.simpleChart;
            btnSimple.classList.toggle('active', state.simpleChart);
            btnSimple.innerText = state.simpleChart ? '簡化：能量總結' : '能量總結圖表模式';
            chart.setDatasetVisibility(0, !state.simpleChart);
            chart.setDatasetVisibility(1, !state.simpleChart);
            chart.update();
        };

        btnReset.onclick = () => {
            state.heat = 0;
            state.v = 0;
            state.x = 0;
            state.screenX = state.restX;
            updateInitialEnergy();
            chart.data.datasets.forEach(d => d.data.fill(0));
            chart.options.scales.y.suggestedMax = 100;
        };

        btnFullscreen.onclick = () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                btnFullscreen.innerText = '退出全螢幕';
            } else {
                document.exitFullscreen();
                btnFullscreen.innerText = '進入全螢幕';
            }
        };

        function handleDrag(clientX) {
            if (state.isDragging) {
                const minX = state.wallX + CONFIG.massSize/2 + 25;
                const maxX = canvas.width - CONFIG.massSize/2 - 25;
                state.screenX = Math.max(minX, Math.min(maxX, clientX));
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            if (Math.abs(e.clientX - state.screenX) < CONFIG.massSize) state.isDragging = true;
        });
        window.addEventListener('mousemove', (e) => handleDrag(e.clientX));
        window.addEventListener('mouseup', () => { if(state.isDragging) { state.isDragging = false; updateInitialEnergy(); } });

        canvas.addEventListener('touchstart', (e) => { 
            if(Math.abs(e.touches[0].clientX - state.screenX) < CONFIG.massSize) state.isDragging = true; 
        });
        window.addEventListener('touchmove', (e) => handleDrag(e.touches[0].clientX));
        window.addEventListener('touchend', () => { if(state.isDragging) { state.isDragging = false; updateInitialEnergy(); } });

        const infoPanel = document.getElementById('info-panel');
        const controlPanel = document.getElementById('control-panel');
        const infoToggle = document.getElementById('info-toggle-btn');
        const ctrlToggle = document.getElementById('ctrl-toggle-btn');

        infoToggle.onclick = () => {
            const isCollapsed = infoPanel.classList.toggle('collapsed');
            infoToggle.innerText = isCollapsed ? '展開' : '收起';
        };

        ctrlToggle.onclick = () => {
            const isCollapsed = controlPanel.classList.toggle('collapsed');
            ctrlToggle.innerText = isCollapsed ? '展開' : '收起';
        };

        resize();

        function loop() {
            frameCount++;
            updatePhysics();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
